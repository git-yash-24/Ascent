<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ascent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,600;1,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
    <style>
      /* Layout: one thumb-reach column at night camp. Summary first (where you stand), then the day chips, then the habits as large rows. Single dark look by choice: the world is a night mountain. One warm colour, the fire. */
      :root {
        --bg: #0d1117;
        --surface: #141a22;
        --raise: #1a222c;
        --line: #26303c;
        --ink: #ede7dc;
        --muted: #a29d94;
        --dim: #6f7680;
        --ember: #e2733f;
        --ember-soft: rgba(226, 115, 63, 0.16);
        --ember-ink: #1c0f08;
        --frost: #9cc3e0;
        --ok: #86c49a;
        --warn: #e3b55b;
        --bad: #e2695a;
        --f-display: 'Spectral', Georgia, 'Times New Roman', serif;
        --f-body: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --r: 12px;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
      #app { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      h1, h2, h3 { text-wrap: balance; margin: 0; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
      .reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }

      /* Header */
      .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
      .mark { font: 600 22px/1 var(--f-display); letter-spacing: .01em; }
      .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
      .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); }
      .dot[data-s='saving'] { border-color: var(--warn); animation: pulse 1s infinite; }
      .dot[data-s='local'] { border-color: var(--warn); }
      .dot[data-s='unsaved'] { background: var(--bad); border-color: var(--bad); }
      @keyframes pulse { 50% { opacity: .3; } }
      .nav { margin-left: auto; }
      .to-game { margin-left: auto; }
      .to-game:not([hidden]) + .nav { margin-left: 0; }

      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); color: var(--ink); font-weight: 600; text-decoration: none; }
      .btn.primary { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); }
      .btn.ghost { background: transparent; }
      .btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
      .btn.big { min-height: 56px; font-size: 17px; padding: 0 24px; }
      .btn:disabled { opacity: .45; cursor: default; }

      /* Summary */
      .today { display: grid; gap: 16px; padding-block: 16px; }
      .summary { display: grid; gap: 14px; }
      .coach { margin: 0; font: italic 500 20px/1.3 var(--f-display); color: var(--ink); }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
      .stat .label, .meter .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      .stat .num { font: 500 24px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
      .stat .note { font-size: 12px; color: var(--muted); }
      .meter { display: grid; gap: 6px; }
      .meter-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
      .meter .val { font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; }
      .track { position: relative; height: 10px; border-radius: 6px; background: var(--raise); border: 1px solid var(--line); overflow: visible; }
      .fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--ember); transition: width .4s ease; }
      .m-week .fill { background: linear-gradient(90deg, var(--frost), var(--ember)); }
      .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; transform: translateX(-1px); border-radius: 1px; }

      /* Banners */
      .banners { display: grid; gap: 10px; }
      .banners:empty { display: none; }
      .banner { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ember); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
      .b-title { margin: 0; font-weight: 600; }
      .b-body { margin: 0; color: var(--muted); font-size: 14px; }
      .b-actions { display: flex; gap: 8px; flex-wrap: wrap; }

      /* Days */
      .days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
      .chip { min-height: 44px; min-width: 64px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 500; flex: none; }
      .chip[aria-pressed='true'] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .logging-for { margin: -4px 0 0; color: var(--muted); font-size: 14px; }
      .logging-for.past { color: var(--warn); font-weight: 600; }

      /* Habits */
      .habits { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      .habit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; display: grid; gap: 6px; }
      .habit[data-state='fulfilled'] { border-color: rgba(226, 115, 63, .5); background: linear-gradient(0deg, var(--ember-soft), var(--ember-soft)), var(--surface); }
      .line { display: flex; align-items: stretch; gap: 6px; }
      .tap, .head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 10px; border-radius: 9px; background: transparent; border: 0; text-align: left; }
      .tap:hover { background: var(--raise); }
      .text { display: grid; min-width: 0; }
      .name { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
      .meta { font-size: 13px; color: var(--muted); }
      .value { margin-left: auto; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .more { width: 48px; min-height: 48px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); letter-spacing: .1em; }
      .more:hover, .more[aria-expanded='true'] { background: var(--raise); color: var(--ink); }
      .controls { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px auto; gap: 6px; padding: 0 4px 4px; }
      .step, .full { min-height: 48px; border-radius: 9px; border: 1px solid var(--line); background: var(--raise); font-size: 20px; font-weight: 600; }
      .full { font-size: 15px; padding: 0 14px; }
      .amount { min-height: 48px; width: 100%; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); text-align: center; font: 500 18px var(--f-mono); }
      .skips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px 6px; }
      .skip { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
      .skip.clear { color: var(--muted); }
      .glyph-slot { flex: none; width: 30px; height: 30px; }
      .glyph { width: 30px; height: 30px; }
      .glyph .ring { stroke: var(--muted); }
      .glyph .dim { stroke: var(--dim); }
      .glyph .fill { fill: var(--ember); }
      .glyph .mark { stroke: var(--ember-ink); }
      .g-skipped .ring { stroke: var(--frost); }
      .later-wrap { display: grid; gap: 8px; }
      .sub { font: 600 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      .later .habit { opacity: .8; }
      .empty { color: var(--muted); padding: 16px; }

      /* Water: Ari's flask */
      .water { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
      .water[data-due='true'] { border-color: var(--frost); box-shadow: inset 3px 0 0 var(--frost); }
      .water-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .water-head .val { font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; }
      .cells { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
      .cell { height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--raise); }
      .cell.on { background: var(--frost); border-color: var(--frost); }
      .water-row { display: flex; align-items: center; gap: 8px; }
      .water-line { margin: 0 auto 0 0; font-size: 14px; color: var(--muted); min-width: 0; }
      .water[data-due='true'] .water-line { color: var(--frost); font-weight: 600; }
      .btn.glass { min-width: 112px; background: var(--frost); border-color: var(--frost); color: var(--bg); }
      .less { width: 48px; padding: 0; font-size: 20px; }
      .habit[data-due='now'] { box-shadow: inset 3px 0 0 var(--ember); }
      .seg { display: flex; flex-wrap: wrap; gap: 6px; }
      .seg-opt { position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px; cursor: pointer; }
      .seg-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
      .seg-opt:has(input:checked) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .seg-opt:has(input:focus-visible) { outline: 2px solid var(--ember); outline-offset: 2px; }
      .amount-block { display: grid; gap: 6px; }

      /* Setup and welcome */
      .setup, .welcome { display: grid; gap: 16px; padding-block: 16px; }
      .setup-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      .setup h1, .welcome h1 { font: 600 28px/1.15 var(--f-display); }
      .setup-body { display: grid; gap: 16px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; scroll-margin-top: 80px; }
      .card h2 { font: 600 20px/1.2 var(--f-display); }
      .card h3 { font-size: 15px; }
      .intro { margin: 0; color: var(--muted); }
      .hint { margin: 0; color: var(--muted); font-size: 13px; }
      .field { display: grid; gap: 6px; min-width: 0; }
      .field > label, .field > .label { font-size: 13px; font-weight: 600; color: var(--muted); }
      input[type='text'], input[type='number'], input[type='date'], input[type='time'], select, textarea { min-height: 48px; width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
      textarea { resize: vertical; }
      .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
      .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
      .check input { width: 22px; height: 22px; accent-color: var(--ember); }
      .habit-form { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; margin: 0; min-width: 0; }
      .habit-form legend { font-weight: 600; padding: 0 6px; }
      .daybox { display: flex; flex-wrap: wrap; gap: 6px; }
      .day { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 22px; }
      .day input { accent-color: var(--ember); width: 18px; height: 18px; }
      .setup-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      .setup-habit { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
      .setup-habit.archived { opacity: .7; }
      .sh-text { display: grid; }
      details summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
      .danger-zone { display: grid; gap: 8px; }
      .danger-zone label { font-size: 14px; color: var(--muted); }
      .log { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
      .dry-run { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; }
      .dry-run p { margin: 0; }
      .bad { color: var(--bad); }
      .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 10; }
      .toast.bad { border-color: var(--bad); }
      .sync-line { margin: 0; font-weight: 600; }
      .conflict { display: grid; gap: 6px; padding-block: 6px; }
      .boot { color: var(--muted); padding-block: 40px; text-align: center; }

      /* ---------- The game screen ----------
         The world fills the whole screen and stays put. Five screens slide over it sideways; on
         each, a caption under the tabs, a minimal glass panel over the lower part of the world,
         and the organised detail further down. Glass, not sheets: the world shows through
         everything. Colour: ember means days made, frost means water and rest, each habit wears
         its tag family's colour, nothing else is coloured. */
      .skip-link { position: absolute; left: 8px; top: -60px; z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-weight: 600; }
      .skip-link:focus { top: 8px; }
      body[data-mode='game'] { overflow: hidden; overscroll-behavior: none; background: #0b0d14; }
      body[data-mode='game'] #app { max-width: none; padding: 0; }
      body[data-mode='game'] .top { position: fixed; inset: 0 0 auto 0; z-index: 8; background: linear-gradient(rgba(6, 8, 14, .5), rgba(6, 8, 14, 0)); border: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 18px; pointer-events: none; transition: opacity .3s; }
      body[data-mode='game'] .top > * { pointer-events: auto; }
      .nav-gear { display: none; width: 20px; height: 20px; }
      body[data-mode='game'] .top { background: none; padding: 0; height: 0; overflow: visible; }
      body[data-mode='game'] .top .mark { display: none; }
      body[data-mode='game'] .top .nav { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; width: 42px; min-height: 42px; height: 42px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: linear-gradient(165deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04)), rgba(12, 16, 24, .3); border: 1px solid rgba(255, 255, 255, .2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 6px 18px rgba(0, 0, 0, .3); backdrop-filter: blur(14px) saturate(170%); -webkit-backdrop-filter: blur(14px) saturate(170%); }
      body[data-mode='game'] .top .nav-gear { display: block; }
      body[data-mode='game'] .top .nav-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      /* Save state is a dot on the gear's shoulder; the words stay for screen readers. */
      body[data-mode='game'] .top .status { position: fixed; z-index: 9; top: calc(9px + env(safe-area-inset-top, 0px)); left: 44px; padding: 0; background: none; pointer-events: none; }
      body[data-mode='game'] .top .status .status-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      body[data-mode='game'] .top .status .dot { width: 9px; height: 9px; box-shadow: 0 0 0 2px rgba(12, 16, 24, .7); }
      body[data-mode='game'] .top .status[data-say='true'] { top: calc(56px + env(safe-area-inset-top, 0px)); left: 12px; display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 12px; background: rgba(12, 16, 24, .6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12px; }
      body[data-mode='game'] .top .status[data-say='true'] .status-text { position: static; width: auto; height: auto; overflow: visible; clip-path: none; }
      body[data-mode='game']:has(.top .status[data-say='true']:not([hidden])) .gap { padding-top: calc(92px + env(safe-area-inset-top, 0px)); }
      body:has(.game[data-lifted='true']) .top .status[data-say='true'] { opacity: 1 !important; top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
      /* The HUD rests: after a few seconds without input the tabs and the gear recede to a low
         contrast, never out of sight, and never while one of them has focus. */
      body[data-mode='game'] .top .nav, .screens, .flask-btn { transition: opacity .6s ease; }
      body.hud-idle[data-mode='game'] .top .nav:not(:focus-within), body.hud-idle .screens:not(:focus-within) { opacity: .55; }
      body.hud-idle .flask-btn:not([data-due='true']):not(:focus-visible) { opacity: .6; }
      .game[data-lifted='true'] .screens, .game[data-lifted='true'] .flask-btn, body:has(.game[data-lifted='true']) .top .nav, body:has(.game[data-lifted='true']) .top .status { opacity: 0 !important; pointer-events: none; }

      /* Liquid glass: a clear pane that blurs and brightens what is behind it, with a bright rim
         and a soft specular sheen at the top. A faint dark base keeps text legible over fire. */
      .glass { position: relative; isolation: isolate; color: var(--ink); background: linear-gradient(165deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04) 48%, rgba(255, 255, 255, .07)), rgba(12, 16, 24, .26); -webkit-backdrop-filter: blur(18px) saturate(175%); backdrop-filter: blur(18px) saturate(175%); border: 1px solid rgba(255, 255, 255, .2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1px 1px rgba(255, 255, 255, .07), inset 0 0 22px rgba(255, 255, 255, .05), 0 12px 32px rgba(0, 0, 0, .3); }
      .glass::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 70% at 18% -20%, rgba(255, 255, 255, .24), transparent 55%), radial-gradient(80% 50% at 100% 120%, rgba(255, 255, 255, .08), transparent 60%); }
      .block { border-radius: 22px; padding: 14px; display: grid; gap: 12px; min-width: 0; }

      .game { position: relative; height: 100svh; }
      .world, .world-fallback { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .world-fallback { background: radial-gradient(120% 70% at 30% 75%, #d8875a 0, #4a3a5c 45%, #141a33 100%); }
      .world-fallback::after { content: ''; position: absolute; inset: 30% 0 0; background: #2a2833; clip-path: polygon(0 100%, 0 60%, 18% 30%, 30% 48%, 46% 8%, 62% 42%, 74% 28%, 100% 62%, 100% 100%); }
      .shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6, 8, 12, 0) 45%, rgba(6, 8, 12, .38) 100%), rgba(6, 8, 12, calc(var(--lift, 0) * .3)); }
      .screens { position: fixed; z-index: 7; top: calc(10px + env(safe-area-inset-top, 0px)); left: 62px; right: 62px; width: max-content; max-width: calc(100% - 124px); margin-inline: auto; display: flex; gap: 2px; padding: 3px; border-radius: 24px; }
      .screen-btn { min-height: 36px; padding: 0 11px; border: 0; border-radius: 20px; background: transparent; color: rgba(237, 231, 220, .72); font-size: 13px; font-weight: 600; }
      .screen-btn[aria-current='page'] { background: rgba(255, 255, 255, .9); color: #10131a; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
      .pager { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
      .pager::-webkit-scrollbar { display: none; }
      .panel { flex: 0 0 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scroll-snap-align: start; scroll-snap-stop: always; overscroll-behavior-y: contain; scrollbar-width: none; outline: none; }
      .panel::-webkit-scrollbar { display: none; }
      .fold { min-height: 100svh; display: flex; flex-direction: column; }
      .gap { flex: 1 0 auto; min-height: 30svh; display: flex; justify-content: center; padding: calc(66px + env(safe-area-inset-top, 0px)) 16px 12px; }
      .caption { width: min(640px, 100%); display: grid; gap: 2px; align-content: start; text-shadow: 0 1px 14px rgba(0, 0, 0, .75), 0 0 2px rgba(0, 0, 0, .6); pointer-events: none; padding-right: 72px; }
      .cap-day { font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: rgba(237, 231, 220, .82); }
      .cap-line { font: italic 500 22px/1.25 var(--f-display); color: var(--ink); }
      .compact { width: min(640px, 100%); margin: 0 auto; padding: 0 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
      /* The detail: a full-screen layer that slides up over the world, which blurs and darkens
         behind it. Its own small title bar replaces the tabs while it is up. */
      .below { position: relative; min-height: 100svh; padding: 0 max(12px, calc((100% - 640px) / 2)) calc(56px + env(safe-area-inset-bottom, 0px)); border-radius: 28px 28px 0 0; background: rgba(9, 11, 17, .62); -webkit-backdrop-filter: blur(28px) saturate(140%); backdrop-filter: blur(28px) saturate(140%); border-top: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 -18px 40px rgba(0, 0, 0, .35); }
      .below::before { content: ''; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(255, 255, 255, .28); }
      .below-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) 2px 12px; margin-bottom: 4px; background: linear-gradient(rgba(9, 11, 17, .92) 70%, rgba(9, 11, 17, 0)); }
      .below-t { flex: 1; font: 600 20px/1.2 var(--f-display); }
      .below-up { height: 36px; padding: 0 12px 0 8px; border-radius: 18px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .07); color: var(--ink); opacity: 0; transition: opacity .3s; }
      .below-up svg { width: 20px; height: 20px; }
      .game[data-lifted='true'] .below-up { opacity: 1; }
      .detail { display: grid; gap: 12px; }
      .detail-body { display: grid; gap: 12px; }
      .compact-today { display: grid; gap: 8px; }
      .sheet-head { display: flex; align-items: center; gap: 12px; }
      .head-l { flex: 1; min-width: 0; display: grid; gap: 6px; }
      .head-sub { margin: 0; font-size: 13px; color: var(--muted); }
      .head-next { display: grid; gap: 2px; padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, .08); }
      .head-next p { margin: 0; font-size: 14px; color: var(--ink); }
      .head-next .head-def { font-size: 12px; color: rgba(237, 231, 220, .62); }
      .week-top { display: flex; align-items: center; gap: 12px; }
      .week-top .g-line { flex: 1; margin: 0; }
      .sheet-head.past .head-sub { color: var(--warn); font-weight: 600; }
      .pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .pill { min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .05); color: var(--muted); font-size: 13px; font-weight: 600; flex: none; }
      .pill[aria-pressed='true'] { background: rgba(255, 255, 255, .9); color: #10131a; border-color: transparent; }
      .ring { --p: 0; --bar: 50; flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(closest-side, rgba(14, 18, 26, .9) 76%, transparent 78%), conic-gradient(var(--ember) calc(var(--p) * 1%), rgba(255, 255, 255, .12) 0); position: relative; }
      .ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(transparent calc(var(--bar) * 1% - .6%), var(--ink) 0 calc(var(--bar) * 1% + .6%), transparent 0); -webkit-mask: radial-gradient(closest-side, transparent 76%, #000 78%); mask: radial-gradient(closest-side, transparent 76%, #000 78%); opacity: .7; }
      .ring-v { font: 500 15px/1 var(--f-mono); }
      .ring-l { font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
      .alerts { display: grid; gap: 6px; }
      .alert { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border-radius: 14px; background: rgba(12, 16, 24, .55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .16); border-left: 3px solid var(--ember); font-size: 14px; }
      .alert > span { flex: 1; min-width: 12ch; }
      .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }

      /* The checklist: glass pills, tinted with the habit's colour once done. */
      .chips { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .chips .empty { grid-column: 1 / -1; padding: 12px; border-radius: 16px; background: rgba(12, 16, 24, .45); }
      .gchip { --fam: var(--ember); --tint: var(--raise); position: relative; overflow: hidden; isolation: isolate; width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 20px; color: var(--ink); text-align: left; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-x pan-y;
        background: linear-gradient(165deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .03) 55%), rgba(12, 16, 24, .3); -webkit-backdrop-filter: blur(16px) saturate(170%); backdrop-filter: blur(16px) saturate(170%); border: 1px solid rgba(255, 255, 255, .2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .42), 0 8px 22px rgba(0, 0, 0, .25); transition: background .3s, border-color .3s, box-shadow .3s, transform .12s; }
      .gchip::before { content: ''; position: absolute; left: 10px; top: 50%; width: 4px; height: 22px; margin-top: -11px; border-radius: 2px; background: var(--fam); opacity: .9; }
      .gchip-glyph { margin-left: 6px; }
      .gchip::after { content: ''; position: absolute; inset: 0; z-index: -1; background: color-mix(in srgb, var(--fam) 34%, transparent); transform-origin: left; transform: scaleX(0); pointer-events: none; }
      .gchip.holding::after { transform: scaleX(1); transition: transform .7s linear; }
      .gchip:active { transform: scale(.975); }
      .gchip[data-state='fulfilled'] { background: linear-gradient(165deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 60%), color-mix(in srgb, var(--fam) 42%, rgba(12, 16, 24, .3)); border-color: color-mix(in srgb, var(--fam) 70%, white); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 22px color-mix(in srgb, var(--fam) 40%, transparent), 0 8px 22px rgba(0, 0, 0, .25); }
      .gchip[data-state='held'], .gchip[data-state='attempted'] { background: linear-gradient(165deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .02) 60%), color-mix(in srgb, var(--fam) 20%, rgba(12, 16, 24, .3)); }
      .gchip[data-state='skipped'] { border-style: dashed; border-color: rgba(156, 195, 224, .6); }
      .gchip[data-state='unscheduled'] { opacity: .6; }
      .gchip-glyph { flex: none; width: 26px; height: 26px; }
      .gchip-glyph .glyph { width: 26px; height: 26px; }
      .gchip .glyph .ring { stroke: color-mix(in srgb, var(--fam) 70%, white); }
      .gchip .glyph .fill { fill: var(--fam); }
      .gchip .glyph .mark { stroke: #10131a; }
      .gchip .g-skipped .ring { stroke: var(--frost); }
      .gchip-text { display: grid; min-width: 0; }
      .gchip-name { font-weight: 600; font-size: 15px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
      .gchip-val { font: 400 12px var(--f-mono); color: rgba(237, 231, 220, .72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gchip-val:empty { display: none; }

      /* The flask on every screen: a glass capsule that fills like the real thing. */
      /* The flask on every screen: a ring gauge in the corner, one segment per glass, with the
         water level showing through its glass core. */
      .flask-btn { --level: 0; position: fixed; z-index: 7; right: 12px; top: calc(8px + env(safe-area-inset-top, 0px)); width: 46px; height: 46px; border-radius: 50%; padding: 0; border: 0; background: none; color: var(--ink); touch-action: pan-x pan-y; -webkit-touch-callout: none; user-select: none; }
      .flask-ring { position: absolute; inset: -3px; pointer-events: none; }
      .flask-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
      .flask-ring circle { fill: none; stroke-width: 3.6; }
      .ring-bg { stroke: rgba(255, 255, 255, .2); }
      .ring-on { stroke: var(--frost); filter: drop-shadow(0 0 3px rgba(168, 236, 255, .7)); transition: stroke-dasharray .6s; }
      .flask-core { position: absolute; inset: 5px; border-radius: 50%; overflow: hidden; isolation: isolate; display: grid; place-items: center; background: linear-gradient(165deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, .03) 55%), rgba(12, 16, 24, .32); -webkit-backdrop-filter: blur(14px) saturate(170%); backdrop-filter: blur(14px) saturate(170%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 18px rgba(0, 0, 0, .3); }
      .flask-fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--level) * 100%); z-index: -1; background: linear-gradient(180deg, rgba(168, 236, 255, .6), rgba(110, 180, 230, .32)); transition: height .8s cubic-bezier(.2, .9, .3, 1.2); }
      .flask-fill::before { content: ''; position: absolute; left: -20%; right: -20%; top: -4px; height: 8px; border-radius: 50%; background: rgba(210, 245, 255, .55); animation: slosh 3.2s ease-in-out infinite; }
      @keyframes slosh { 50% { transform: translateX(8%) rotate(3deg); } }
      .flask-icon { width: 20px; height: 20px; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .4)); }
      .flask-n { position: absolute; left: 50%; top: calc(100% + 5px); transform: translateX(-50%); font: 600 11px var(--f-mono); white-space: nowrap; text-shadow: 0 1px 5px rgba(0, 0, 0, .8); }
      .flask-btn[data-due='true'] .flask-core { animation: thirst 2.4s ease-in-out infinite; }
      @keyframes thirst { 50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 0 0 7px rgba(168, 236, 255, .2), 0 6px 18px rgba(0, 0, 0, .3); } }
      .flask-btn.gulp { animation: gulp .7s cubic-bezier(.3, 1.6, .5, 1); }
      @keyframes gulp { 30% { transform: scale(1.12, .92); } 60% { transform: scale(.95, 1.06); } }
      .flask-btn.holding { transform: scale(.96); transition: transform .7s; }

      /* Labels pinned to the world: the week's days (tap to replay) and "you are here". */
      .labels { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
      .day-pin { position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--f-mono); color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .2s; background: rgba(12, 16, 24, .45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, .35); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
      .day-pin::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 2px; height: 8px; margin-left: -1px; background: rgba(255, 255, 255, .5); }
      .day-pin.o-closed { background: color-mix(in srgb, var(--ember) 75%, transparent); border-color: #ffd0a8; color: var(--ember-ink); }
      .day-pin.o-partial { background: color-mix(in srgb, var(--ember) 35%, rgba(12, 16, 24, .45)); border-color: var(--ember); }
      .day-pin.o-rested, .day-pin.o-excused { background: color-mix(in srgb, var(--frost) 45%, transparent); border-color: var(--frost); }
      .day-pin.o-missed { border-style: dashed; border-color: var(--bad); color: var(--muted); }
      .day-pin.o-today { border-color: #fff; box-shadow: 0 0 0 4px rgba(255, 255, 255, .18), 0 4px 14px rgba(0, 0, 0, .35); animation: today 2s ease-in-out infinite; }
      @keyframes today { 50% { box-shadow: 0 0 0 8px rgba(255, 255, 255, .06), 0 4px 14px rgba(0, 0, 0, .35); } }
      .day-pin.o-future { border-style: dotted; color: var(--muted); background: rgba(12, 16, 24, .3); }
      .day-pin:disabled { cursor: default; }
      .here { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 18px; background: rgba(12, 16, 24, .5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, .25); font: 600 12px var(--f-body); letter-spacing: .04em; opacity: 0; white-space: nowrap; }
      .here-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 4px rgba(226, 115, 63, .3); animation: today 1.6s ease-in-out infinite; }

      /* The replay: letterbox, a caption per beat, progress ticks. */
      .reel { position: fixed; inset: 0; z-index: 20; cursor: pointer; }
      .bars { position: absolute; left: 0; right: 0; height: 11svh; background: #000; animation: bars .5s ease-out both; }
      .bars.top { top: 0; } .bars.bottom { bottom: 0; transform-origin: bottom; }
      @keyframes bars { from { transform: scaleY(0); } }
      .bars.top { transform-origin: top; }
      .reel-card { --fam: rgba(255, 255, 255, .5); position: absolute; left: 50%; bottom: calc(11svh + 20px); width: min(560px, calc(100% - 32px)); transform: translateX(-50%); border-radius: 22px; padding: 14px 18px; display: grid; gap: 4px; border-left: 4px solid var(--fam); }
      .reel-card.in { animation: card .45s cubic-bezier(.2, .8, .2, 1); }
      @keyframes card { from { opacity: 0; transform: translate(-50%, 14px); } }
      .reel-card.dim { opacity: .7; }
      .reel-k { font: 600 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--fam); }
      .reel-t { font: italic 500 24px/1.25 var(--f-display); }
      .reel-t.quote { font-size: 19px; }
      .reel-progress { position: absolute; top: calc(11svh + 12px); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; width: min(560px, calc(100% - 32px)); }
      .reel-progress span { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .25); }
      .reel-progress span.on { background: rgba(255, 255, 255, .9); }
      .reel-skip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .1); color: var(--ink); font-weight: 600; z-index: 1; }
      .game.replaying .screens, .game.replaying .flask-btn, .game.replaying .pager { opacity: 0; pointer-events: none; }
      body:has(.game.replaying) .top { opacity: 0; pointer-events: none; }

      /* The opening: the title over the falling snow, then a glass card over the camp. */
      .onboard { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
      .onboard > * { pointer-events: auto; }
      .ob-title { position: absolute; left: 0; right: 0; top: 30svh; display: grid; justify-items: center; gap: 8px; text-align: center; pointer-events: none; text-shadow: 0 2px 24px rgba(0, 0, 0, .6); opacity: 0; animation: obTitle 7.5s ease both; transition: opacity .8s; }
      .ob-title span { font: 500 46px/1 var(--f-display); letter-spacing: .32em; padding-left: .32em; text-transform: uppercase; }
      .ob-title small { font: italic 400 17px var(--f-display); color: rgba(237, 231, 220, .8); letter-spacing: .04em; }
      .ob-title.gone { opacity: 0 !important; animation: none; }
      @keyframes obTitle { 0%, 8% { opacity: 0; transform: translateY(8px); } 22%, 52% { opacity: 1; transform: none; } 70%, 100% { opacity: 0; } }
      .ob-skip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .1); color: var(--ink); font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      .ob-card { position: absolute; left: 50%; bottom: 0; width: min(560px, 100%); max-height: 86svh; overflow-y: auto; overscroll-behavior: contain; transform: translateX(-50%); border-radius: 28px 28px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(165deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03) 48%), rgba(10, 12, 18, .72); animation: obCard .7s cubic-bezier(.2, .8, .2, 1) both; }
      .ob-card[hidden] { display: none; }
      .ob-card .welcome { padding-block: 0; }
      .ob-h { margin: 0; font: 600 26px/1.15 var(--f-display); }
      @keyframes obCard { from { opacity: 0; transform: translate(-50%, 40px); } }
      .game.onboarding .screens, .game.onboarding .pager, .game.onboarding .flask-btn, .game.onboarding .labels { opacity: 0; pointer-events: none; }
      body:has(.game.onboarding) .top { display: none; }

      /* Your mark: symbols and colours as round radio tiles. */
      .mark-pick { display: grid; gap: 10px; }
      .mark-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .mark-opt { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .05); transition: background .2s, border-color .2s, box-shadow .2s; }
      .mark-opt input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
      .mark-opt:has(input:checked) { border-color: #fff; background: rgba(255, 255, 255, .16); box-shadow: 0 0 0 3px rgba(255, 255, 255, .16); }
      .mark-opt:has(input:focus-visible) { outline: 2px solid var(--frost); outline-offset: 2px; }
      .mark-opt .sym { width: 24px; height: 24px; }
      .mark-opt .swatch { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); }
      /* On a phone the tabs take the top row and the flask sits just under its corner. */
      @media (max-width: 520px) { .screens { right: 12px; max-width: calc(100% - 74px); } .flask-btn { top: calc(60px + env(safe-area-inset-top, 0px)); } }
      @media (max-width: 370px) { .screen-btn { padding: 0 8px; font-size: 12px; } }

      .flask { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-radius: 22px; }
      .flask[data-due='true'] { border-color: rgba(168, 236, 255, .8); }
      .flask-text { flex: 1; min-width: 0; display: grid; gap: 6px; }
      .flask-l { font-size: 13px; color: var(--muted); }
      .flask[data-due='true'] .flask-l { color: var(--frost); font-weight: 600; }
      .flask-cells { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
      .fc { height: 8px; border-radius: 3px; background: rgba(255, 255, 255, .1); }
      .fc.on { background: var(--frost); }
      .flask .btn { min-height: 44px; }
      .flask .less { width: 44px; }
      .flask .btn.glass { background: rgba(255, 255, 255, .08); border-color: color-mix(in srgb, var(--frost) 70%, transparent); color: var(--ink); }
      .g-sec { display: grid; gap: 10px; }
      .g-sec-h { margin: 0; font: 600 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: rgba(237, 231, 220, .7); }
      .fam { display: grid; gap: 10px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--fam) 10%, rgba(255, 255, 255, .03)); border-left: 3px solid var(--fam); }
      .fam-h { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fam); }
      .tag-dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .fam-h .tag-dot { margin: 0; }
      .tag-dot.big { width: 18px; height: 18px; margin: 0; }
      .tag-pick { display: flex; align-items: center; gap: 10px; }
      .g-row { display: grid; gap: 4px; }
      .g-row-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
      .g-row-name { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
      .g-row-val { font: 500 13px var(--f-mono); white-space: nowrap; }
      .g-row-meta { font-size: 12px; color: var(--muted); }
      .g-row-meta:empty { display: none; }
      .g-bar { position: relative; display: block; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: visible; }
      .g-bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width .4s ease; }
      .g-bar.tall { height: 12px; border-radius: 6px; }
      .g-bar-fill.week { background: linear-gradient(90deg, var(--frost), var(--ember)); border-radius: 6px; }
      .g-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--muted); transform: translateX(-1px); }
      .g-mark.bar { background: var(--ink); }
      .g-legend { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
      .g-legend.key { justify-content: flex-start; gap: 12px; }
      .key-i { display: inline-flex; align-items: center; gap: 6px; }
      .key-sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
      .g-line { margin: 0; font-size: 14px; color: var(--muted); }
      .g-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
      .g-stat { display: grid; padding: 10px 12px; border-radius: 16px; background: rgba(12, 16, 24, .45); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .g-stat-v { font: 500 20px var(--f-mono); }
      .g-stat-l { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
      .big-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .big-v { font: 500 34px/1 var(--f-mono); }
      .big-l { font: italic 500 17px var(--f-display); color: rgba(237, 231, 220, .8); }
      .peek { display: grid; gap: 8px; }
      .peek-line { margin: 0; font-size: 15px; }
      .peek-more { margin: 0; font-size: 12px; color: var(--dim); }
      .peek .advice { background: rgba(255, 255, 255, .06); }

      /* Day colours, shared by week, month and year */
      .o-closed, .v-climb { background: var(--ember); color: var(--ember-ink); }
      .o-partial { background: color-mix(in srgb, var(--ember) calc(20% + var(--f, .5) * 55%), var(--raise)); }
      .o-rested, .v-rest { background: color-mix(in srgb, var(--frost) 55%, var(--raise)); color: var(--bg); }
      .o-excused { background: #454b56; }
      .o-missed { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bad) 70%, transparent); color: var(--muted); }
      .o-future { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); }
      .o-free { background: rgba(255, 255, 255, .07); color: var(--dim); }
      .o-today { background: color-mix(in srgb, var(--ember) calc(var(--f, 0) * 80%), var(--raise)); box-shadow: 0 0 0 2px var(--ink); }
      .v-summit { background: #ffd27a; }
      .v-hold { background: #8a6a45; }
      .v-slip { background: var(--bad); }
      .weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
      .wd { display: grid; gap: 4px; justify-items: center; padding: 0; border: 0; background: none; color: inherit; border-radius: 10px; }
      .wd:not(:disabled):active { transform: scale(.95); }
      .wd:disabled { cursor: default; }
      .wd-bar { width: 100%; height: 44px; border-radius: 8px; }
      .wd-l { font: 500 12px var(--f-mono); color: var(--muted); }
      .wk { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 10px; background: rgba(255, 255, 255, .06) !important; color: var(--ink) !important; border-left: 4px solid; font-size: 14px; }
      .wk.v-summit { border-color: #ffd27a; } .wk.v-climb { border-color: var(--ember); } .wk.v-hold { border-color: #8a6a45; } .wk.v-slip { border-color: var(--bad); } .wk.v-rest { border-color: var(--frost); }
      .wk-d, .wk-s { font: 500 13px var(--f-mono); color: var(--muted); }
      .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
      .cal-h { text-align: center; font: 500 11px var(--f-mono); color: var(--dim); }
      .cal-d { aspect-ratio: 1; max-height: 52px; border-radius: 8px; display: grid; place-content: center; font: 500 12px var(--f-mono); }
      .stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .st { height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .12); }
      .st.done { background: var(--ember); }
      .st.here { background: linear-gradient(90deg, var(--ember), var(--raise)); box-shadow: 0 0 0 2px var(--ink); }
      .vstrip { display: flex; flex-wrap: wrap; gap: 3px; }
      .vs { width: 12px; height: 20px; border-radius: 3px; }
      .vs.live { background: repeating-linear-gradient(135deg, var(--ember) 0 3px, var(--raise) 3px 6px); box-shadow: 0 0 0 1px var(--ink); }
      .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); grid-auto-columns: minmax(0, 1fr); gap: 3px; }
      .hd { aspect-ratio: 1; border-radius: 2px; }
      .hd.o-future { box-shadow: none; }

      /* Base camp */
      .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 16px; background: rgba(0, 0, 0, .22); }
      .tab { flex: 1; min-height: 40px; border: 0; border-radius: 13px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; }
      .tab[aria-selected='true'] { background: rgba(255, 255, 255, .9); color: #10131a; }
      .tab-body { display: grid; gap: 12px; }
      .trophies { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .trophy { display: grid; justify-items: center; text-align: center; gap: 2px; padding: 10px 6px; border-radius: 16px; background: rgba(255, 255, 255, .06); opacity: .62; }
      .trophy.on { opacity: 1; background: linear-gradient(var(--ember-soft), var(--ember-soft)), rgba(255, 255, 255, .06); }
      .badge { --p: 0; width: 48px; height: 48px; border-radius: 50%; display: grid; place-content: center; font: 600 20px var(--f-display); background: radial-gradient(closest-side, rgba(14, 18, 26, .92) 80%, transparent 82%), conic-gradient(var(--muted) calc(var(--p) * 1%), rgba(255, 255, 255, .14) 0); }
      .trophy.on .badge { background: radial-gradient(closest-side, #ffd27a 80%, transparent 82%), conic-gradient(var(--ember) 100%, var(--line) 0); color: var(--ember-ink); }
      .badge.item { border-radius: 14px; }
      .tr-name { font-weight: 600; font-size: 13px; }
      .tr-how { font-size: 11px; color: var(--muted); }
      .league { border-radius: 16px; padding: 10px 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--tint) 85%, transparent), rgba(255, 255, 255, .04)); border-left: 4px solid var(--fam); display: grid; gap: 8px; }
      .league-h { display: flex; align-items: center; gap: 6px; }
      .league-name { flex: 1; min-width: 0; font-size: 15px; }
      .league-name span { color: var(--muted); font-size: 13px; }
      .tier { font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 10px; background: rgba(0, 0, 0, .3); color: var(--fam); }
      .t-summit .tier { background: #ffd27a; color: var(--ember-ink); }
      .board { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
      .board li { display: grid; grid-template-columns: minmax(0, 1fr) 70px 40px; gap: 8px; align-items: center; font-size: 14px; }
      .board .b-v { font: 500 12px var(--f-mono); text-align: right; }
      .league-next { margin: 0; font-size: 12px; color: var(--muted); }
      .advice { margin: 0; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, .06); border-left: 3px solid var(--fam, var(--ember)); font-size: 15px; }
      .note { min-height: 64px; background: rgba(0, 0, 0, .25) !important; border-color: rgba(255, 255, 255, .18) !important; border-radius: 14px !important; }
      .note-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .note-state { font-size: 13px; color: var(--muted); }
      .notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .notes li { display: grid; gap: 2px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
      .n-d { font: 500 11px var(--f-mono); color: var(--muted); }
      .n-t { white-space: pre-wrap; overflow-wrap: anywhere; }

      /* The hold menu */
      dialog.opts { --fam: var(--ember); margin: auto auto 12px; width: min(560px, calc(100% - 16px)); max-width: 100%; max-height: 85svh; border: 1px solid rgba(255, 255, 255, .22); border-radius: 28px; background: linear-gradient(165deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03) 50%), rgba(16, 20, 30, .62); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 20px 50px rgba(0, 0, 0, .45); color: var(--ink); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
      dialog.opts:not([open]) { display: none; }
      dialog.opts::backdrop { background: rgba(0, 0, 0, .3); }
      .opts-title { font: 600 20px var(--f-display); display: flex; align-items: center; gap: 4px; }
      .opts-hint { margin: 0; font-size: 13px; color: var(--muted); }
      .opts-row { display: flex; gap: 8px; }
      .opts-amount { flex: 1; text-align: center; font: 500 18px var(--f-mono) !important; }
      .opt-attempt { flex: 1; border-color: var(--fam); }
      .opts-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .opt { min-height: 48px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .07); font-weight: 600; font-size: 14px; }
      .opt-rest { border-color: var(--frost); color: var(--frost); }
      .opt-sick { border-color: #8a8f99; }
      .opts-foot { display: flex; justify-content: space-between; gap: 8px; }
      .opts-day { font: 500 14px var(--f-body); color: var(--warn); }
      .opt-done { flex: 1; min-height: 48px; }
      .opt-done.undone { border-color: rgba(255, 255, 255, .3); }
      /* Undo, for a few seconds after a change: it puts back exactly what was there. */
      .undo { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 6px 6px 6px 14px; border-radius: 16px; background: rgba(14, 18, 24, .78); border: 1px solid rgba(255, 255, 255, .16); font-size: 14px; animation: undoIn .18s ease-out; }
      .undo[hidden] { display: none; }
      @keyframes undoIn { from { opacity: 0; transform: translateY(6px); } }
      @media (min-width: 900px) { .cap-line { font-size: 26px; } .chips { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    </style>
  </head>
