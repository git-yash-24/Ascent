<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ascent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" />
    <style>
      /* Layout: one centred column; a night camp. The page's single warm colour is Ari's hood. */
      :root {
        --bg: #0e1218;
        --surface: #151b24;
        --line: #252e3b;
        --ink: #ece6da;
        --muted: #9aa3b0;
        --ember: #e0693a;
        --ok: #7fc59a;
        --warn: #e2b259;
        --bad: #e2786c;
        --f-display: 'Spectral', Georgia, 'Times New Roman', serif;
        --f-body: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) {
          --bg: #f3efe7; --surface: #fbf9f4; --line: #ddd5c6; --ink: #1d2128; --muted: #5d6470;
          --ember: #b8481c; --ok: #2f7d4f; --warn: #94650c; --bad: #a83a2e; color-scheme: light;
        }
      }
      :root[data-theme='light'] {
        --bg: #f3efe7; --surface: #fbf9f4; --line: #ddd5c6; --ink: #1d2128; --muted: #5d6470;
        --ember: #b8481c; --ok: #2f7d4f; --warn: #94650c; --bad: #a83a2e; color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
      main { max-width: 560px; margin: 0 auto; padding-inline: 20px; padding-block: 56px 64px; display: grid; gap: 28px; }
      .mark { display: flex; align-items: center; gap: 14px; }
      .ember { width: 14px; height: 14px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 18px 4px color-mix(in srgb, var(--ember) 55%, transparent); animation: flicker 2.4s ease-in-out infinite; }
      @keyframes flicker { 0%, 100% { opacity: 1; transform: scale(1); } 40% { opacity: .78; transform: scale(.92); } 70% { opacity: .92; transform: scale(1.05); } }
      @media (prefers-reduced-motion: reduce) { .ember { animation: none; } }
      h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.6rem, 9vw, 3.6rem); letter-spacing: .01em; line-height: 1; margin: 0; }
      .lede { margin: 0; color: var(--muted); max-width: 44ch; text-wrap: pretty; }
      .meta { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
      h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
      ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      .check { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--line); }
      .check-body { min-width: 0; }
      .check-label { font-weight: 500; }
      .check-detail { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
      .pill { flex: none; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
      .check[data-status='yes'] .pill { color: var(--ok); }
      .check[data-status='partial'] .pill { color: var(--warn); }
      .check[data-status='no'] .pill { color: var(--bad); }
      .check[data-status='pending'] .pill { color: var(--muted); }
      footer { color: var(--muted); font-size: 13.5px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span class="ember" aria-hidden="true"></span><h1>Ascent</h1></div>
      <p class="lede">Nothing to log yet. This first build checks that your device can run what comes next: the camp, the story and your synced record.</p>
      <section aria-labelledby="checks-title">
        <h2 id="checks-title">This device</h2>
        <ul id="checks" aria-live="polite"></ul>
      </section>
      <div class="meta"><span id="today"></span><span id="build"></span></div>
      <footer>Milestone M1 of 16. Next: the feel test, a 60-second scene at a cold camp.</footer>
    </main>
    <script type="module" src="/src/shell/main.ts"></script>
  </body>
</html>
